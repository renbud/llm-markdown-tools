[project]
name = "llm-markdown-tools"
version = "0.1.0"
description = "OpenAI-compatible HTML and document to Markdown conversion helpers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Renato Buda", email = "rmbuda@gmail.com" },
]
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "html2text>=2025.4.15",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_markdown_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: tests that require a live OpenAI-compatible endpoint and are disabled by default",
]
